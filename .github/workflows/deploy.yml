name: Deploy Chatwoot

on:
  push:
    branches:
      - prod-nsid

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Chatwoot
    runs-on: self-hosted

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Deploy Chatwoot
      - name: Deploy Chatwoot
        run: |
          set -eo pipefail

          # A failed deploy must never leave the app down (nginx would serve 502),
          # and must dump enough context to debug without shell access.
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::group::Diagnostics (deploy failed, rc=$rc)"
              sudo systemctl status chatwoot.target --no-pager 2>&1 | tail -30 || true
              sudo journalctl -u 'chatwoot*' -n 80 --no-pager 2>&1 | tail -80 || true
              echo "::endgroup::"
              echo "::error::Deploy failed (rc=$rc) - app restarted on the previous build."
            fi
            # `start` is a no-op when already running.
            sudo systemctl start chatwoot.target >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Stopping Chatwoot..."
          sudo systemctl stop chatwoot.target

          # Must run BEFORE the build: pnpm writes into node_modules and dies with
          # EACCES if anything in the tree is owned by another user.
          echo "Fixing ownership..."
          sudo chown -R chatwoot:chatwoot /home/chatwoot/chatwoot

          echo "Deploying latest code..."
          sudo -u chatwoot -H bash << 'DEPLOY'
          set -eo pipefail

          export HOME=/home/chatwoot
          source /usr/local/rvm/scripts/rvm
          rvm use 3.4.4

          # cd FIRST: this shell inherits the runner's workspace as CWD, which the
          # chatwoot user cannot even stat (pnpm reports EACCES on scandir).
          cd /home/chatwoot/chatwoot

          echo "node: $(command -v node) $(node -v)"
          echo "pnpm: $(command -v pnpm) $(pnpm -v)"

          # The dashboard bundle is large; without headroom vite gets OOM-killed.
          export NODE_OPTIONS="--max-old-space-size=4096"

          git fetch origin
          git reset --hard origin/prod-nsid

          bundle install --without development test

          # A node_modules tree left half-written by an earlier failed deploy makes
          # pnpm fail on relink/prune. Wiping and reinstalling is the only recovery
          # available unattended.
          if ! pnpm install; then
            echo "pnpm install failed - rebuilding node_modules from scratch"
            rm -rf node_modules
            pnpm install
          fi

          # Drop only the build-skip cache, never the live bundle: if the build
          # fails, a stale bundle still beats no bundle at all.
          rm -rf tmp/vite

          # Marker to prove the manifest below was written by THIS run.
          mkdir -p tmp && touch tmp/deploy-marker

          RAILS_ENV=production bundle exec rake assets:precompile

          MANIFEST=public/vite/.vite/manifest.json
          [ -f "$MANIFEST" ] || MANIFEST=public/vite/manifest.json

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::vite build produced no manifest - frontend was NOT rebuilt"
            exit 1
          fi
          if [ ! "$MANIFEST" -nt tmp/deploy-marker ]; then
            echo "::error::$MANIFEST is stale - vite skipped the build, frontend is old"
            exit 1
          fi
          echo "Frontend rebuilt: $MANIFEST"
          ls -la "$MANIFEST"

          RAILS_ENV=production bundle exec rake db:migrate
          DEPLOY

          echo "Restarting Chatwoot..."
          sudo systemctl daemon-reload
          sudo systemctl restart chatwoot.target

          echo "Waiting for application..."
          sleep 10

          echo "Verifying deployment..."
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/)

          if [ "$STATUS" = "200" ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed (HTTP $STATUS)"
            exit 1
          fi
