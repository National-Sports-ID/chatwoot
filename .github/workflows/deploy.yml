name: Deploy Chatwoot

on:
  push:
    branches:
      - prod-nsid

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Chatwoot
    runs-on: self-hosted

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Deploy Chatwoot
      - name: Deploy Chatwoot
        run: |
          set -eo pipefail

          echo "Stopping Chatwoot..."
          sudo systemctl stop chatwoot.target

          echo "Deploying latest code..."
          sudo -u chatwoot -H bash << 'DEPLOY'
          set -eo pipefail

          export HOME=/home/chatwoot
          source /usr/local/rvm/scripts/rvm
          rvm use 3.4.4

          # Non-login shell: .bashrc/.profile are NOT read, so node/pnpm must be
          # put on PATH here. Adjust to match how node is installed on the server:
          #   nvm      -> source "$HOME/.nvm/nvm.sh" && nvm use 24
          #   fnm      -> eval "$(fnm env)"
          #   nodesource/apt -> already in /usr/bin, nothing needed
          export PNPM_HOME="$HOME/.local/share/pnpm"
          export PATH="$PNPM_HOME:$PATH"
          if [ -s "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh"; nvm use 24; fi

          echo "node: $(command -v node) $(node -v)"
          echo "pnpm: $(command -v pnpm) $(pnpm -v)"

          # The dashboard bundle needs headroom or vite gets OOM-killed.
          export NODE_OPTIONS="--max-old-space-size=4096"

          cd /home/chatwoot/chatwoot

          git fetch origin
          git reset --hard origin/prod-nsid

          bundle install --without development test

          pnpm install --frozen-lockfile

          # public/vite is gitignored, so a stale bundle survives git reset.
          # Drop it to guarantee we serve only freshly built assets.
          rm -rf public/vite public/vite-* tmp/vite

          RAILS_ENV=production bundle exec rake assets:precompile

          # Fail loudly if the vite build produced nothing.
          test -f public/vite/.vite/manifest.json || test -f public/vite/manifest.json
          echo "Vite manifest built:"
          ls -la public/vite/.vite/manifest.json public/vite/manifest.json 2>/dev/null || true

          RAILS_ENV=production bundle exec rake db:migrate
          DEPLOY

          echo "Fixing permissions..."
          sudo chown -R chatwoot:chatwoot /home/chatwoot/chatwoot

          echo "Restarting Chatwoot..."
          sudo systemctl daemon-reload
          sudo systemctl restart chatwoot.target

          echo "Waiting for application..."
          sleep 10

          echo "Verifying deployment..."
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000/)

          if [ "$STATUS" = "200" ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed (HTTP $STATUS)"
            exit 1
          fi
